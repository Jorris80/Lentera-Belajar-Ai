<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffdf8">
<meta name="description" content="Lentera Belajar AI — platform belajar sepanjang hayat dengan tutor AI.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Lentera Belajar AI</title>
<style>
/* Lentera Belajar AI — gaya. Tanpa font/ikon eksternal (aman lisensi & luring). */
:root{
  --acc:#b7791f;--acc2:#1e3a5f;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;
  --bg:#f6f3ec;--surf:#fffdf8;--surf2:#efe9dc;--line:#e0d8c6;--ink:#1c2430;--mute:#667085;--on:#fff;
  --r:14px;--sh:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.07);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --side:248px;--top:58px;--bot:62px;
}
[data-theme=zamrud]{--acc:#0f766e;--acc2:#134e4a}
[data-theme=samudra]{--acc:#1d4ed8;--acc2:#0f2a5c}
[data-theme=mawar]{--acc:#be185d;--acc2:#4a1230}
[data-theme=ungu]{--acc:#6d28d9;--acc2:#2e1065}
[data-theme=grafit]{--acc:#334155;--acc2:#0f172a}
[data-mode=dark]{--bg:#0d131c;--surf:#151d29;--surf2:#1c2635;--line:#2a3648;--ink:#e8ecf2;--mute:#94a3b8;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}
[data-mode=dark]{--acc-fg:color-mix(in srgb,var(--acc) 55%,#fff)}
:root{--acc-fg:var(--acc)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.55 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.2}h2{font-size:19px}h3{font-size:16px}
p{margin:0 0 .7em}a{color:var(--acc-fg)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.mute{color:var(--mute)}.small{font-size:13px}.tiny{font-size:11.5px}.right{text-align:right}.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.num{font-variant-numeric:tabular-nums}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tombol & masukan */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 15px;border-radius:10px;border:1px solid var(--line);background:var(--surf);cursor:pointer;font-weight:600;font-size:14px;transition:transform .08s,background .15s,border-color .15s;-webkit-tap-highlight-color:transparent;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--acc)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surf2)}
.btn.bad{color:var(--bad)}.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.icon{width:40px;padding:0}.btn.sm.icon{width:32px}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.busy{position:relative;color:transparent!important}
.btn.busy::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--mute);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn.pri.busy::after{border-color:#fff;border-top-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.inp,select.inp,textarea.inp{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surf);outline:0}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
textarea.inp{resize:vertical;min-height:90px;line-height:1.5}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.fld{margin-bottom:12px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;margin:8px 0}.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--acc);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* kerangka */
#shell{min-height:100%;display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:var(--top) 1fr}
.top{grid-column:1/-1;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:0 16px;height:var(--top);background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;cursor:zoom-in;overflow:hidden;flex:none;border:0;padding:0}
.logo img{width:100%;height:100%;object-fit:cover}
.brand .ttl{font-family:var(--serif);font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .edit{opacity:.5}.brand .edit:hover{opacity:1}
.side{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;padding:12px 10px;border-right:1px solid var(--line);background:var(--surf)}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:14.5px;cursor:pointer}
.nav a:hover{background:var(--surf2)}
.nav a.on{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc-fg);font-weight:700}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
main{padding:22px clamp(14px,3vw,34px) 40px;min-width:0;max-width:1180px;width:100%}
.bot{display:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--acc2);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none;border:0;padding:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:92px;height:92px;font-size:34px;cursor:zoom-in}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surf2);white-space:nowrap}
.pill.acc{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc-fg)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
[data-mode=dark] .pill.ok{color:#4ade80}[data-mode=dark] .pill.warn{color:#fbbf24}[data-mode=dark] .pill.bad,[data-mode=dark] .btn.bad{color:#f87171}
.offbar{background:var(--warn);color:#fff;text-align:center;font-size:13px;padding:4px 10px;grid-column:1/-1}

/* kartu & daftar */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.kpi b{display:block;font:600 24px/1.2 var(--serif)}.kpi span{font-size:12.5px;color:var(--mute)}
.hero{border-radius:18px;padding:22px;color:#fff;background:radial-gradient(120% 140% at 0% 0%,var(--acc) 0%,var(--acc2) 62%);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero h1{color:#fff}.hero .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}
.it{display:flex;align-items:center;gap:12px}
.list>.it{padding:11px 4px;border-bottom:1px solid var(--line)}
.list>.it:last-child{border-bottom:0}
.it.click{cursor:pointer;border-radius:8px}.it.click:hover{background:var(--surf2)}
.bar{height:8px;border-radius:99px;background:var(--surf2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .4s}
.cover{height:92px;border-radius:10px;margin:-4px -4px 12px;display:grid;place-items:center;color:#fff;font:600 30px var(--serif);background:linear-gradient(135deg,var(--c1,var(--acc)),var(--c2,var(--acc2)))}
.empty{text-align:center;padding:34px 16px;color:var(--mute)}
.empty svg{width:38px;height:38px;opacity:.5;margin-bottom:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:9px 13px;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--acc-fg);border-color:var(--acc)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll-x{overflow-x:auto}
.md p{margin:0 0 .6em}.md pre{background:var(--surf2);padding:10px 12px;border-radius:9px;overflow:auto;font-size:13px}
.md code{background:var(--surf2);padding:1px 5px;border-radius:5px;font-size:.92em}.md pre code{background:none;padding:0}
.md ul,.md ol{margin:.2em 0 .7em;padding-left:1.35em}.md h4{margin:.6em 0 .3em;font-size:15px}

/* obrolan */
.chat{display:grid;grid-template-columns:270px 1fr;gap:14px;height:calc(100vh - var(--top) - 70px);min-height:420px}
.chat .sess{overflow:auto}.chat .pane{display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(84%,680px);padding:10px 14px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:5px}
.msg.assistant{align-self:flex-start;background:var(--surf2);border-bottom-left-radius:5px}
.msg .act{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.msg img{max-width:160px;border-radius:8px;display:block;margin-top:6px;cursor:zoom-in}
.typing i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);margin-right:4px;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:flex-end;background:var(--surf)}
.composer textarea{min-height:42px;max-height:140px}
.rec{color:var(--bad)!important;border-color:var(--bad)!important}

/* lapisan */
.ovl{position:fixed;inset:0;z-index:60;background:rgba(8,12,20,.55);display:grid;place-items:center;padding:14px;animation:fade .15s}
.dlg{background:var(--surf);border-radius:18px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .16s}
.dlg.wide{width:min(820px,100%)}
.dlg>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg>.body{padding:18px;overflow:auto}
.dlg>footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.lbx{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.9);touch-action:none;overflow:hidden;animation:fade .15s}
.lbx img{position:absolute;left:50%;top:50%;max-width:92vw;max-height:84vh;transform-origin:center;user-select:none;-webkit-user-drag:none;cursor:grab;will-change:transform}
.lbx .ctl{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(30,30,30,.8);padding:6px;border-radius:14px}
.lbx .ctl .btn{background:transparent;border-color:transparent;color:#fff;min-width:44px}
#toast{position:fixed;left:50%;bottom:calc(var(--bot) + 18px);transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.tst{background:#1f2937;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--sh);animation:pop .18s}
.tst.bad{background:var(--bad)}.tst.ok{background:var(--ok)}

/* masuk */
.auth{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}
.auth .art{background:radial-gradient(130% 120% at 10% 0%,var(--acc) 0%,var(--acc2) 60%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.auth .art h1{font-size:40px;color:#fff;max-width:13ch}
.auth .art li{margin:.45em 0}
.auth .box{display:grid;place-items:center;padding:24px}
.auth .in{width:min(420px,100%)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surf2);padding:4px;border-radius:12px;margin-bottom:16px}
.seg a{text-align:center;padding:8px;border-radius:9px;font-weight:600;cursor:pointer;font-size:14px}
.seg a.on{background:var(--surf);box-shadow:var(--sh)}

/* kartu ingatan, sertifikat, timer */
.flash{min-height:210px;display:grid;place-items:center;text-align:center;font:600 26px/1.3 var(--serif);cursor:pointer;padding:24px}
.certp{border:2px solid var(--acc);border-radius:10px;padding:34px 28px;text-align:center;background:var(--surf);position:relative;color:var(--ink)}
.certp::before{content:"";position:absolute;inset:7px;border:1px solid var(--line);border-radius:6px;pointer-events:none}
.certp h1{font-size:30px;margin:8px 0}.certp .nm{font:600 26px var(--serif);border-bottom:1px solid var(--line);display:inline-block;padding:4px 30px;margin:10px 0}
.qr svg{width:120px;height:120px;background:#fff;border-radius:6px}
.ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;margin:8px auto;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--surf2) 0)}
.ring>div{width:160px;height:160px;border-radius:50%;background:var(--surf);display:grid;place-items:center;font:600 38px var(--serif)}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--surf);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.legal h3{margin:16px 0 6px}.legal{font-size:14px}

@media (max-width:860px){
  #shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:16px 14px calc(var(--bot) + 26px)}
  .bot{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:40;height:calc(var(--bot) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surf);border-top:1px solid var(--line)}
  .bot a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .bot a.on{color:var(--acc-fg)}
  .auth{grid-template-columns:1fr}.auth .art{padding:26px 22px}.auth .art h1{font-size:28px}.auth .art ul{display:none}
  .chat{grid-template-columns:1fr;height:calc(100vh - var(--top) - var(--bot) - 44px)}
  .chat.open .sess{display:none}.chat:not(.open) .pane{display:none}
  .grid2{grid-template-columns:1fr}
  h1{font-size:22px}
  .ovl{align-items:end;padding:0}.dlg{border-radius:18px 18px 0 0;width:100%;max-height:94vh}
  .brand .ttl{font-size:16px}
  .msg{max-width:90%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body *{visibility:hidden}.printable,.printable *{visibility:visible}
  .printable{position:absolute;left:0;top:0;width:100%;box-shadow:none}
  .ovl{position:static;background:none;padding:0}.dlg{box-shadow:none;max-height:none}.dlg>header,.dlg>footer{display:none}
}
</style>
</head>

  const paint = w => $('#qList', w).innerHTML = qs.length ? qs.map((q, i) => '<div class="it"><div class="grow small"><b>' + (i + 1) + '.</b> ' + esc(q.q) + ' <span class="pill">' + (q.type === 'mc' ? 'PG' : 'esai') + '</span></div><button class="btn ghost sm icon bad" data-rm="' + i + '" type="button" aria-label="Hapus soal">' + ic('x') + '</button></div>').join('') : '<p class="small mute">Belum ada soal.</p>';
  const h = modal({wide: true, title: 'Kuis baru', body: '<div class="grid2"><div class="fld"><label class="f">Judul</label><input class="inp" name="title" maxlength="150"></div><div class="fld"><label class="f">Kompetensi</label><input class="inp" name="competency" maxlength="80"></div></div>' +
    '<div class="grid2"><div class="fld"><label class="f">Tautkan ke kursus (opsional)</label><select class="inp" name="courseId"><option value="">—</option>' + (D().courses || []).filter(c => c.ownerId === me().id || hasRole(R_ADMIN)).map(c => '<option value="' + c.id + '">' + esc(c.title) + '</option>').join('') + '</select></div><div class="fld"><label class="f">Status</label><select class="inp" name="status"><option value="published">Terbit</option><option value="draft">Draf</option></select></div></div>' +
    '<label class="chk"><input type="checkbox" name="highStakes"><span>Ujian penting — nilai AI selalu ditinjau penilai manusia</span></label><div class="list card flat" id="qList" style="margin:10px 0"></div>' +
    '<div class="card flat"><div class="fld"><label class="f">Pertanyaan</label><textarea class="inp" id="nq" style="min-height:60px"></textarea></div><div class="fld"><label class="f">Jenis</label><select class="inp" id="nt"><option value="mc">Pilihan ganda</option><option value="essay">Esai (rubrik)</option></select></div><div id="nmc"><div class="grid2">' + [0, 1, 2, 3].map(i => '<input class="inp" data-opt="' + i + '" placeholder="Opsi ' + 'ABCD'[i] + '">').join('') + '</div><div class="grid2" style="margin-top:8px"><select class="inp" id="na">' + [0, 1, 2, 3].map(i => '<option value="' + i + '">Jawaban benar: ' + 'ABCD'[i] + '</option>').join('') + '</select><input class="inp" id="ne" placeholder="Pembahasan singkat"></div></div><div id="nes" class="hide"><textarea class="inp" id="nr" placeholder="Rubrik penilaian" style="min-height:60px"></textarea></div><button class="btn sm" id="nAdd" type="button" style="margin-top:8px">' + ic('plus') + 'Tambah soal</button></div>',
    foot: '<button class="btn" data-x>Batal</button><button class="btn pri" id="qzS">Simpan kuis</button>',
    init: w => { paint(w);
      $('#nt', w).onchange = e => { $('#nmc', w).classList.toggle('hide', e.target.value !== 'mc'); $('#nes', w).classList.toggle('hide', e.target.value === 'mc'); };
      $('#nAdd', w).onclick = () => { const q = $('#nq', w).value.trim(); if (!q) return toast('Isi pertanyaan.', 'bad'); if ($('#nt', w).value === 'mc') { const options = $$('[data-opt]', w).map(i => i.value.trim()).filter(Boolean); if (options.length < 2) return toast('Minimal 2 opsi.', 'bad'); qs.push({type: 'mc', q, options, answer: Math.min(Number($('#na', w).value), options.length - 1), explain: $('#ne', w).value}); } else qs.push({type: 'essay', q, rubric: $('#nr', w).value}); $('#nq', w).value = ''; $$('[data-opt]', w).forEach(i => i.value = ''); paint(w); };
      $('#qList', w).onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { qs.splice(Number(b.dataset.rm), 1); paint(w); } };
      $('#qzS', w).onclick = ev => { const f = formData(w); f.questions = qs; busy(ev.target, api('quiz.save', f)).then(() => { h.close(); sync(true); toast('Kuis tersimpan', 'ok'); }).catch(() => {}); }; }});
};
</script>
<script>
/* Lentera Belajar AI — tampilan: kartu bahasa, kelas, sertifikat, alat, anak, langganan, mengajar, admin, profil, tentang, masuk. */
'use strict';

/* ================= KARTU (pengulangan berjarak Leitner, bisa luring) ================= */
const BOX_DAYS = [0, 1, 3, 7, 14, 30];
function deckSave(k) { saveBoot(); return apiQ('deck.save', {id: k._new ? undefined : k.id, newId: k._new ? k.id : undefined, title: k.title, language: k.language, cards: k.cards}, 'deck' + k.id).then(r => { if (r) delete k._new; return r; }); }
VIEWS.cards = {render(el) {
  const ds = D().decks || [];
  el.innerHTML = head('Bahasa & Kartu', 'Kosakata dan hafalan dengan pengulangan berjarak. Bisa dipakai luring.', '<button class="btn pri" data-act="deckForm">' + ic('plus') + 'Dek baru</button>') +
    '<div class="card"><h3>Buat dek dengan AI</h3><div class="grid2" style="margin-top:10px"><input class="inp" id="dkT" placeholder="Topik, mis. Perkenalan diri" maxlength="150"><select class="inp" id="dkL">' + ['Inggris', 'Arab', 'Mandarin', 'Jepang', 'Korea', 'Jerman', 'Prancis', 'Spanyol', 'Indonesia'].map(x => '<option>' + x + '</option>').join('') + '</select></div><div class="row wrap" style="margin-top:10px"><button class="btn pri" data-act="deckGen">Buat 10 kartu</button><button class="btn" data-go="tutor" data-p=\'{"fresh":1,"mode":"conversation"}\'>' + ic('chat') + 'Latihan percakapan</button></div></div>' +
    '<div class="sec"><h2>Dek saya</h2></div>' + (ds.length ? '<div class="cards">' + ds.map(k => { const due = (k.cards || []).filter(c => !c.due || c.due <= today()).length; return '<div class="card"><div class="row between"><h3 class="ell">' + esc(k.title) + '</h3><span class="pill">' + esc(k.language || '-') + '</span></div><p class="small mute">' + (k.cards || []).length + ' kartu · <b>' + due + '</b> siap diulang</p><div class="row"><button class="btn pri sm" data-go="study" data-p=\'' + esc(JSON.stringify({id: k.id})) + '\'' + (due ? '' : ' disabled') + '>Ulangi</button><button class="btn sm" data-act="deckForm" data-id="' + k.id + '">Kelola</button></div></div>'; }).join('') + '</div>' : '<div class="card">' + empty('cards', 'Belum ada dek kartu.') + '</div>');
}};
ACT.deckGen = el => { const t = $('#dkT').value.trim(); if (!t) return toast('Isi topik.', 'bad'); busy(el, api('deck.generate', {topic: t, language: $('#dkL').value})).then(k => { D().decks.push(k); saveBoot(); render(); toast('Dek dibuat', 'ok'); }).catch(() => {}); };
ACT.deckForm = el => {
  const k = el.dataset.id ? D().decks.find(x => x.id === el.dataset.id) : {id: uid(), _new: true, title: '', language: 'Inggris', cards: []};
  const cards = (k.cards || []).map(c => Object.assign({}, c));
  const paint = w => $('#dcl', w).innerHTML = cards.length ? cards.map((c, i) => '<div class="it"><div class="grow small"><b>' + esc(c.f) + '</b> — ' + esc(c.b) + '</div><button class="btn ghost sm icon bad" data-rm="' + i + '" aria-label="Hapus kartu">' + ic('x') + '</button></div>').join('') : '<p class="small mute">Belum ada kartu.</p>';
  const h = modal({title: k._new ? 'Dek baru' : 'Kelola dek', body: '<div class="grid2"><div class="fld"><label class="f">Judul</label><input class="inp" name="title" maxlength="100" value="' + esc(k.title) + '"></div><div class="fld"><label class="f">Bahasa/mapel</label><input class="inp" name="language" maxlength="30" value="' + esc(k.language || '') + '"></div></div><div class="row"><input class="inp" id="cf" placeholder="Depan (kata/pertanyaan)"><input class="inp" id="cb" placeholder="Belakang (arti/jawaban)"><button class="btn icon" id="cAdd" aria-label="Tambah kartu">' + ic('plus') + '</button></div><div class="list" id="dcl" style="margin-top:10px;max-height:40vh;overflow:auto"></div>',
    foot: (k._new ? '' : '<button class="btn ghost bad" id="dDel">Hapus dek</button>') + '<button class="btn" data-x>Batal</button><button class="btn pri" id="dSave">Simpan</button>',
    init: w => { paint(w);
      $('#cAdd', w).onclick = () => { const f = $('#cf', w).value.trim(), b = $('#cb', w).value.trim(); if (!f || !b) return; cards.push({id: uid(), f, b, box: 1, due: ''}); $('#cf', w).value = $('#cb', w).value = ''; $('#cf', w).focus(); paint(w); };
      $('#dcl', w).onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { cards.splice(Number(b.dataset.rm), 1); paint(w); } };
      $('#dSave', w).onclick = () => { const f = formData(w); if (!f.title.trim()) return toast('Judul wajib diisi.', 'bad'); k.title = f.title; k.language = f.language; k.cards = cards; if (k._new && D().decks.indexOf(k) < 0) D().decks.push(k); deckSave(k).catch(e => toast(e.message, 'bad')); h.close(); render(); };
      if (!k._new) $('#dDel', w).onclick = () => { D().decks = D().decks.filter(x => x.id !== k.id); saveBoot(); apiQ('deck.delete', {id: k.id}, 'deck' + k.id).catch(e => toast(e.message, 'bad')); h.close(); render(); };
    }});
};
VIEWS.study = {parent: 'cards', render(el, p) {
  const k = (D().decks || []).find(x => x.id === p.id); if (!k) return go('cards', {}, true);
  const due = k.cards.filter(c => !c.due || c.due <= today());
  if (!due.length) { el.innerHTML = head(k.title, 'Sesi selesai', '', true) + '<div class="card">' + empty('award', 'Semua kartu sudah diulang hari ini. Hebat!') + '</div>'; return; }
  const c = due[0]; let flip = false;
  el.innerHTML = head(k.title, due.length + ' kartu tersisa · kotak ' + c.box + '/5', '', true) + '<div class="card flash" id="fc" tabindex="0" role="button" aria-label="Balik kartu">' + esc(c.f) + '</div><p class="center tiny mute" style="margin:8px 0">Ketuk kartu untuk melihat jawabannya</p><div class="row hide" id="fb" style="justify-content:center"><button class="btn bad" data-r="0">Belum hafal</button><button class="btn pri" data-r="1">Sudah hafal</button></div>';
  const fc = $('#fc'), turn = () => { flip = !flip; fc.innerHTML = flip ? '<div><div class="small mute">' + esc(c.f) + '</div>' + esc(c.b) + '</div>' : esc(c.f); $('#fb').classList.remove('hide'); };
  fc.onclick = turn; fc.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); turn(); } };
  $('#fb').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; c.box = b.dataset.r === '1' ? Math.min(5, (c.box || 1) + 1) : 1;
    const dd = new Date(Date.now() + 7 * 3600000 + BOX_DAYS[b.dataset.r === '1' ? c.box : 1] * 86400000); c.due = dd.toISOString().slice(0, 10);
    deckSave(k).catch(er => toast(er.message, 'bad')); render(); };
}};

/* ================= KELAS VIRTUAL ================= */
VIEWS.classes = {render(el) {
  const cs = D().classes || [];
  el.innerHTML = head('Kelas', 'Jadwal, tautan pertemuan daring, dan diskusi kelas.', hasRole(R_TEACH) ? '<button class="btn pri" data-act="classForm">' + ic('plus') + 'Buat kelas</button>' : '') +
    '<div class="card"><div class="row"><input class="inp" id="clCode" placeholder="Kode kelas dari guru" maxlength="10" style="text-transform:uppercase"><button class="btn pri" data-act="classJoin">Gabung</button></div></div>' +
    '<div class="sec"><h2>Kelas saya</h2></div>' + (cs.length ? '<div class="cards">' + cs.map(c => '<div class="card it click" style="display:block" data-go="class" data-p=\'' + esc(JSON.stringify({id: c.id})) + '\'><h3>' + esc(c.name) + '</h3><p class="small mute" style="margin:4px 0">' + esc(c.ownerName || '') + ' · ' + (c.members || []).length + ' anggota</p><p class="small" style="margin:0">' + esc(c.schedule || 'Jadwal belum diisi') + '</p></div>').join('') + '</div>' : '<div class="card">' + empty('users', 'Belum bergabung di kelas mana pun.') + '</div>');
}};
ACT.classJoin = el => { const code = $('#clCode').value.trim(); if (!code) return; busy(el, api('class.join', {code})).then(c => { const d = D(); d.classes = d.classes.filter(x => x.id !== c.id).concat([c]); saveBoot(); go('class', {id: c.id}); }).catch(() => {}); };
ACT.classForm = el => {
  const c = el.dataset.id ? D().classes.find(x => x.id === el.dataset.id) : {};
  const h = modal({title: c.id ? 'Ubah kelas' : 'Kelas baru', body: '<div class="fld"><label class="f">Nama kelas</label><input class="inp" name="name" maxlength="100" value="' + esc(c.name || '') + '"></div><div class="fld"><label class="f">Jadwal</label><input class="inp" name="schedule" maxlength="200" placeholder="mis. Selasa & Kamis 19.00 WIB" value="' + esc(c.schedule || '') + '"></div><div class="fld"><label class="f">Tautan pertemuan (Google Meet/Zoom/Jitsi)</label><input class="inp" name="meetUrl" placeholder="https://…" value="' + esc(c.meetUrl || '') + '"></div>',
    foot: (c.id ? '<button class="btn ghost bad" id="kDel">Hapus</button>' : '') + '<button class="btn" data-x>Batal</button><button class="btn pri" id="kSave">Simpan</button>',
    init: w => { $('#kSave', w).onclick = ev => { const f = formData(w); f.id = c.id; busy(ev.target, api('class.save', f)).then(nc => { const d = D(); d.classes = d.classes.filter(x => x.id !== nc.id).concat([nc]); saveBoot(); h.close(); go('class', {id: nc.id}, !!c.id); }).catch(() => {}); };
      if (c.id) $('#kDel', w).onclick = () => confirmBox('Hapus kelas dan diskusinya?', 'Hapus', true).then(y => y && api('class.delete', {id: c.id}).then(() => { D().classes = D().classes.filter(x => x.id !== c.id); saveBoot(); h.close(); go('classes', {}, true); }, e => toast(e.message, 'bad'))); }});
};
VIEWS.class = {parent: 'classes', render(el, p) {
  el.innerHTML = head('Kelas', '', '', true) + '<div class="card"><div class="typing"><i></i><i></i><i></i></div></div>';
  api('class.get', {id: p.id}).then(r => {
    if (S.view !== 'class') return;
    const c = r.cls, own = c.ownerId === me().id || hasRole(R_ADMIN), ros = Object.keys(r.roster);
    el.innerHTML = head(c.name, (c.ownerName || '') + ' · ' + (c.schedule || 'jadwal belum diisi'), own ? '<button class="btn sm" data-act="classForm" data-id="' + c.id + '">Ubah</button>' : '<button class="btn sm ghost bad" data-act="classLeave" data-id="' + c.id + '">Keluar kelas</button>', true) +
      '<div class="card row wrap between"><div>' + (own ? 'Kode gabung: <b class="num" style="font-size:20px;letter-spacing:.12em">' + esc(c.code) + '</b>' : '<span class="mute">Pertemuan daring</span>') + '</div>' + (c.meetUrl ? '<a class="btn pri" target="_blank" rel="noopener noreferrer" href="' + esc(c.meetUrl) + '">' + ic('play') + 'Masuk kelas daring</a>' : '<span class="pill">Tautan belum tersedia</span>') + '</div>' +
      (own ? '<div class="sec"><h2>Anggota (' + ros.length + ')</h2></div><div class="card list">' + (ros.length ? ros.map(id => '<div class="it"><div class="grow">' + esc(r.roster[id].name) + '<div class="tiny mute">Aktif terakhir: ' + esc(r.roster[id].lastActive || '-') + '</div></div><b class="num">' + r.roster[id].xp + ' XP</b></div>').join('') : '<p class="small mute">Bagikan kode gabung kepada peserta.</p>') + '</div>' : '') +
      '<div class="sec"><h2>Diskusi</h2></div><div class="card"><div class="list">' + (r.posts.length ? r.posts.map(x => '<div class="it" style="align-items:flex-start"><div class="grow"><b>' + esc(x.userName) + '</b> <span class="tiny mute">' + fdate(x.createdAt) + '</span><div>' + esc(x.text).replace(/\n/g, '<br>') + '</div></div></div>').join('') : '<p class="small mute">Belum ada diskusi.</p>') + '</div><div class="row" style="margin-top:10px"><input class="inp" id="cpT" maxlength="1500" placeholder="Tulis pesan untuk kelas…"><button class="btn pri icon" data-act="classPost" data-id="' + c.id + '" aria-label="Kirim">' + ic('send') + '</button></div></div>';
  }).catch(e => { el.innerHTML = head('Kelas', '', '', true) + '<div class="card">' + empty('info', e.message) + '</div>'; });
}};
ACT.classPost = el => { const t = $('#cpT').value.trim(); if (!t) return; busy(el, api('class.post', {classId: el.dataset.id, text: t})).then(() => render()).catch(() => {}); };
ACT.classLeave = el => confirmBox('Keluar dari kelas ini?', 'Keluar').then(y => y && api('class.leave', {id: el.dataset.id}).then(() => { D().classes = D().classes.filter(x => x.id !== el.dataset.id); saveBoot(); go('classes', {}, true); }, e => toast(e.message, 'bad')));

/* ================= SERTIFIKAT ================= */
function verifyUrl(num) { const b = brand().webUrl || CFG.gasUrl || ''; return b ? b + (b.indexOf('?') < 0 ? '?' : '&') + 'verify=' + encodeURIComponent(num) : ''; }
function qrSvg(text) { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize: 3, margin: 2, scalable: true}); } catch (e) { return ''; } }
VIEWS.certs = {render(el) {
  const cs = (D().certs || []).slice().reverse();
  el.innerHTML = head('Sertifikat', 'Sertifikat penyelesaian dengan nomor unik dan verifikasi QR.', '<button class="btn" data-act="verifyForm">Verifikasi nomor</button>') +
    (cs.length ? '<div class="cards">' + cs.map(c => '<div class="card"><div class="row between"><span class="pill ' + (c.status === 'valid' ? 'ok' : 'bad') + '">' + (c.status === 'valid' ? 'Sah' : 'Dicabut') + '</span><span class="tiny mute num">' + esc(c.number) + '</span></div><h3 style="margin:8px 0 2px">' + esc(c.title) + '</h3><p class="small mute">' + esc(c.issuer) + ' · ' + fdate(c.issuedAt) + '</p><button class="btn sm pri" data-act="certOpen" data-id="' + c.id + '">Lihat & cetak</button></div>').join('') + '</div>' : '<div class="card">' + empty('award', 'Selesaikan seluruh pelajaran sebuah kursus untuk memperoleh sertifikat.') + '</div>') +
    '<p class="tiny mute" style="margin-top:14px">Sertifikat di aplikasi ini adalah sertifikat penyelesaian kursus, bukan sertifikasi profesi resmi atau berlisensi negara.</p>';
}};
ACT.certOpen = el => {
  const c = D().certs.find(x => x.id === el.dataset.id), url = verifyUrl(c.number);
  modal({wide: true, title: 'Sertifikat', body: '<div class="certp printable"><div class="row" style="justify-content:center"><span class="logo" style="cursor:default">' + logoHtml() + '</span><b>' + esc(c.issuer) + '</b></div><p class="mute" style="margin:14px 0 0;letter-spacing:.2em;font-size:12px">SERTIFIKAT PENYELESAIAN</p><p style="margin:10px 0 0">diberikan kepada</p><div class="nm">' + esc(c.userName) + '</div><p style="margin:0">atas penyelesaian kursus</p><h1>' + esc(c.title) + '</h1><p class="small mute">Kompetensi: ' + esc((c.competencies || []).join(', ') || '-') + ' · Terbit ' + fdate(c.issuedAt) + '</p>' +
    '<div class="row" style="justify-content:center;margin-top:14px;gap:18px"><div class="qr">' + (url ? qrSvg(url) : '') + '</div><div style="text-align:left"><div class="tiny mute">Nomor sertifikat</div><b class="num">' + esc(c.number) + '</b><div class="tiny mute" style="margin-top:6px;max-width:230px">' + (url ? 'Pindai QR untuk memverifikasi keaslian.' : 'Verifikasi melalui menu Sertifikat → Verifikasi nomor.') + ' Bukan sertifikasi profesi resmi.</div></div></div></div>',
    foot: '<button class="btn" data-x>Tutup</button><button class="btn pri" onclick="print()">Cetak / simpan PDF</button>', noFocus: true});
};
ACT.verifyForm = () => { const h = modal({title: 'Verifikasi sertifikat', body: '<div class="row"><input class="inp" id="vN" placeholder="LB-XXXXXX-XXXXXXXX" style="text-transform:uppercase"><button class="btn pri" id="vGo">Periksa</button></div><div id="vR" style="margin-top:14px"></div>', init: w => $('#vGo', w).onclick = ev => busy(ev.target, api('cert.verify', {number: $('#vN', w).value})).then(c => { $('#vR', w).innerHTML = !c.found ? '<span class="pill bad">Tidak ditemukan</span>' : '<span class="pill ' + (c.status === 'valid' ? 'ok">Sah' : 'bad">' + (c.status === 'revoked' ? 'Dicabut' : 'Kedaluwarsa')) + '</span><p style="margin-top:8px"><b>' + esc(c.name) + '</b><br>' + esc(c.title) + '<br><span class="small mute">' + esc(c.issuer) + ' · ' + fdate(c.issuedAt) + '</span></p><p class="tiny mute">' + esc(c.note) + '</p>'; }).catch(() => {})}); };

/* ================= ALAT BELAJAR: timer fokus + catatan (luring) ================= */
const Pomo = {left: 25 * 60, total: 25 * 60, run: null, mode: 'Fokus'};
function pomoPaint() { const r = $('#pRing'); if (!r) return; r.style.setProperty('--p', 100 - Pomo.left * 100 / Pomo.total); $('#pTime').textContent = String(Math.floor(Pomo.left / 60)).padStart(2, '0') + ':' + String(Pomo.left % 60).padStart(2, '0'); $('#pMode').textContent = Pomo.mode; $('#pGo').textContent = Pomo.run ? 'Jeda' : 'Mulai'; }
ACT.pomoGo = () => { if (Pomo.run) { clearInterval(Pomo.run); Pomo.run = null; } else Pomo.run = setInterval(() => { if (--Pomo.left <= 0) { clearInterval(Pomo.run); Pomo.run = null; const f = Pomo.mode === 'Fokus'; Pomo.mode = f ? 'Istirahat' : 'Fokus'; Pomo.total = Pomo.left = (f ? 5 : 25) * 60; toast(f ? 'Sesi fokus selesai — istirahat 5 menit.' : 'Istirahat selesai — ayo fokus lagi!', 'ok'); try { navigator.vibrate && navigator.vibrate(300); } catch (e) {} } pomoPaint(); }, 1000); pomoPaint(); };
ACT.pomoReset = () => { clearInterval(Pomo.run); Pomo.run = null; Pomo.mode = 'Fokus'; Pomo.total = Pomo.left = 25 * 60; pomoPaint(); };
VIEWS.tools = {render(el) {
  const ns = (D().notes || []).slice().sort((a, b) => a.updatedAt < b.updatedAt ? 1 : -1);
  el.innerHTML = head('Alat Belajar', 'Timer fokus dan catatan pribadi — tetap bisa dipakai tanpa internet.') +
    '<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card center"><h3 id="pMode">Fokus</h3><div class="ring" id="pRing" style="--p:0"><div class="num" id="pTime">25:00</div></div><div class="row" style="justify-content:center"><button class="btn pri" data-act="pomoGo" id="pGo">Mulai</button><button class="btn" data-act="pomoReset">Ulang</button></div><p class="tiny mute" style="margin-top:8px">25 menit fokus, 5 menit istirahat.</p></div>' +

<script>

function renderAuth(tab) {
  tab = tab || 'login'; const b = brand(), needUrl = !IS_GAS && !CFG.gasUrl;
  $('#app').innerHTML = '<div class="auth"><div class="art"><div class="row"><button class="logo js-logo" data-act="zoomLogo" style="background:rgba(255,255,255,.18)" aria-label="Logo">' + logoHtml() + '</button><b class="js-title" style="font-family:var(--serif);font-size:19px">' + esc(b.title) + '</b></div><div><h1 class="js-tag">' + esc(b.tagline) + '</h1><ul style="padding-left:1.1em;opacity:.92;margin-top:18px"><li>Tutor AI yang menuntun, bukan sekadar memberi jawaban</li><li>Rencana belajar personal & peta penguasaan</li><li>Kursus, kuis, kartu ingatan, kelas, dan sertifikat</li><li>Ramah anak dengan kontrol orang tua</li></ul></div><p class="tiny" style="opacity:.75;margin:0">v' + esc(b.version || VERSION) + '</p></div>' +
    '<div class="box"><div class="in">' + (needUrl || tab === 'server' ? '<h2>Hubungkan ke server</h2><p class="small mute">Tempel URL Web App Google Apps Script (berakhiran <code>/exec</code>) dari admin Anda.</p><div class="fld"><input class="inp" id="gUrl" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(CFG.gasUrl) + '"></div><button class="btn pri" style="width:100%" data-act="saveUrl">Simpan & uji koneksi</button>' :
    '<div class="seg"><a class="' + (tab === 'login' ? 'on' : '') + '" data-act="authTab" data-t="login">Masuk</a><a class="' + (tab === 'register' ? 'on' : '') + '" data-act="authTab" data-t="register">Daftar</a></div><form id="af" novalidate>' +
    (tab === 'register' ? '<div class="fld"><label class="f" for="rn">Nama lengkap</label><input class="inp" id="rn" name="name" maxlength="80" autocomplete="name" required></div>' : '') +
    '<div class="fld"><label class="f" for="re">Email</label><input class="inp" id="re" name="email" type="email" autocomplete="email" required></div><div class="fld"><label class="f" for="rpw">Kata sandi</label><input class="inp" id="rpw" name="password" type="password" autocomplete="' + (tab === 'login' ? 'current-password' : 'new-password') + '" minlength="8" required></div>' +
    (tab === 'register' ? '<div class="grid2"><div class="fld"><label class="f">Saya adalah</label><select class="inp" name="role" id="rRole"><option value="student">Pelajar / mahasiswa</option><option value="professional">Profesional</option><option value="parent">Orang tua / wali</option></select></div><div class="fld" id="ageF"><label class="f">Kelompok usia</label><select class="inp" name="ageGroup" id="rAge"><option value="dewasa">18 tahun ke atas</option><option value="remaja">13–17 tahun</option><option value="anak">Di bawah 13 tahun</option></select></div></div>' +
      '<div id="gdF" class="hide"><div class="fld"><label class="f">Email orang tua / wali</label><input class="inp" name="guardianEmail" type="email"></div><label class="chk"><input type="checkbox" name="guardianConsent"><span>Saya orang tua/wali dan menyetujui pembuatan akun serta pemrosesan data anak ini.</span></label></div>' +
      '<div class="fld"><label class="f">Kode institusi <span class="mute">(opsional)</span></label><input class="inp" name="tenantCode" maxlength="12" style="text-transform:uppercase"></div><label class="chk"><input type="checkbox" name="consent"><span>Saya menyetujui <a href="#" data-act="terms">Syarat & Ketentuan</a> dan <a href="#" data-act="privacy">Pemberitahuan Privasi</a>.</span></label>' : '') +
    '<button class="btn pri" style="width:100%;margin-top:6px" type="submit">' + (tab === 'login' ? 'Masuk' : 'Buat akun') + '</button></form>') +
    '<p class="tiny mute center" style="margin-top:16px"><a href="#" data-act="verifyForm">Verifikasi sertifikat</a> · <a href="#" data-act="terms">S&K</a> · <a href="#" data-act="privacy">Privasi</a>' + (IS_GAS ? '' : ' · <a href="#" data-act="authTab" data-t="server">Server</a>') + '</p></div></div></div>';
  const f = $('#af');
  if (f) { f.onsubmit = e => { e.preventDefault(); const d = formData(f); if (!d.email || !d.password) return toast('Isi email dan kata sandi.', 'bad'); busy($('button[type=submit]', f), api(tab, d)).then(enterApp).catch(() => {}); };
    const ag = $('#rAge'), rr = $('#rRole'), upd = () => { const stu = rr.value === 'student'; $('#ageF').classList.toggle('hide', !stu); $('#gdF').classList.toggle('hide', !stu || ag.value === 'dewasa'); };

ACT.authTab = el => renderAuth(el.dataset.t);
ACT.saveUrl = el => { const u = $('#gUrl').value.trim(); if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return toast('URL harus berupa https://script.google.com/…/exec', 'bad'); CFG.gasUrl = u; busy(el, api('brand')).then(b => { LS.set('gasUrl', u); S.brand = b; LS.set('brand', b); applyTheme(); renderAuth('login'); toast('Terhubung', 'ok'); }).catch(() => { CFG.gasUrl = LS.get('gasUrl', ''); }); };

/* ================= BOOT ================= */
function boot() {
  applyTheme(); Hist.init();
  addEventListener('online', () => { updateNet(); sync(true); }); addEventListener('offline', updateNet);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
  if (S.token && S.boot) { render(); sync(true); } // tampil seketika dari cache, lalu segarkan di latar belakang
  else { S.token = ''; renderAuth(); if (IS_GAS || CFG.gasUrl) api('brand').then(b => { S.brand = b; LS.set('brand', b); applyBrand(); }).catch(() => {}); }
  if ('serviceWorker' in navigator && !IS_GAS && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
</script>
